<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>굿즈샵</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>상품 목록</h1>
    <div id="products" class="products">불러오는 중...</div>
  </main>

  <!-- 결제 화면: 구매하기를 누르면 나타남 -->
  <div id="pay" class="pay" hidden>
    <div class="pay-box">
      <h2 id="pay-title"></h2>
      <div class="price" id="pay-amount"></div>
      <div id="payment-method"></div>
      <div id="agreement"></div>
      <button id="pay-btn">결제하기</button>
      <button id="pay-cancel" class="secondary">취소</button>
    </div>
  </div>

  <script>
    async function loadProducts() {
      const { data, error } = await sb.from("products").select("*").order("id");
      const box = document.getElementById("products");
      if (error) { box.textContent = "상품을 불러오지 못했습니다."; return; }

      box.innerHTML = data.map(p => `
        <div class="card">
          <img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer">
          <div class="body">
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.description)}</p>
            <div class="price">${won(p.price)}</div>
            <button onclick="buy(${p.id}, this)">구매하기</button>
          </div>
        </div>`).join("");
    }

    async function buy(productId, btn) {
      const user = await getUser();
      if (!user) { location.href = "login.html"; return; }

      btn.disabled = true;
      // 1) 주문 만들기 (가격은 DB가 자동으로 채움)
      const orderId = "order_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      const { data: order, error } = await sb.from("orders")
        .insert({ product_id: productId, order_id: orderId })
        .select().single();
      if (error) { alert("주문 생성 실패: " + error.message); btn.disabled = false; return; }

      // 2) 결제 화면에 토스 결제위젯 그리기 (금액 = DB에 저장된 금액)
      try {
        document.getElementById("pay-title").textContent = order.product_name;
        document.getElementById("pay-amount").textContent = won(order.amount);
        document.getElementById("pay").hidden = false;

        const widgets = TossPayments(TOSS_CLIENT_KEY).widgets({ customerKey: user.id });
        await widgets.setAmount({ currency: "KRW", value: order.amount });
        await Promise.all([
          widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
          widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
        ]);

        // 3) 결제하기 → 토스 결제 진행 → 성공 시 success.html 로 이동
        document.getElementById("pay-btn").onclick = async () => {
          try {
            await widgets.requestPayment({
              orderId: order.order_id,
              orderName: order.product_name,
              customerEmail: user.email,
              successUrl: new URL("success.html", location.href).href,
              failUrl: new URL("fail.html", location.href).href,
            });
          } catch (e) {
            alert(e.message); // 사용자가 결제를 취소한 경우 등
          }
        };
      } catch (e) {
        alert("결제 화면을 불러오지 못했습니다: " + e.message);
        location.reload();
      }
    }

    // 취소: 페이지를 새로 불러와 결제 화면을 닫음
    document.getElementById("pay-cancel").onclick = () => location.reload();

    renderNav();
    loadProducts();
  </script>
</body>
</html>
