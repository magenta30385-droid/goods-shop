<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <nav id="nav"></nav>
  <div class="box">
    <div class="tabs">
      <button id="tab-login" class="active">로그인</button>
      <button id="tab-signup">회원가입</button>
    </div>
    <form id="form">
      <input type="email" id="email" placeholder="이메일" required>
      <input type="password" id="password" placeholder="비밀번호 (6자 이상)" minlength="6" required>
      <button type="submit" id="submit">로그인</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    let mode = "login";

    function setMode(m) {
      mode = m;
      document.getElementById("tab-login").classList.toggle("active", m === "login");
      document.getElementById("tab-signup").classList.toggle("active", m === "signup");
      document.getElementById("submit").textContent = m === "login" ? "로그인" : "회원가입";
      document.getElementById("msg").textContent = "";
    }
    document.getElementById("tab-login").onclick = () => setMode("login");
    document.getElementById("tab-signup").onclick = () => setMode("signup");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = mode === "login"
        ? await sb.auth.signInWithPassword({ email, password })
        : await sb.auth.signUp({ email, password });

      if (error) {
        document.getElementById("msg").textContent = error.message;
        return;
      }
      const user = await getUser();
      location.href = isAdmin(user) ? "admin.html" : "index.html";
    };

    renderNav();
  </script>
</body>
</html>
